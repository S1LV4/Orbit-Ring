name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: Tests (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Plugin compatibility
        run: npm run test:plugins

      - name: Build
        run: npm run build

      - name: System test
        run: npm run test:system

      - name: Install browser for end-to-end tests
        run: npx playwright install chromium

      - name: End-to-end tests (ring and config UI)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            packages/ring/test-results
            packages/ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Installer (Windows x64)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./packages/ring/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/ring version $version"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Build installer
        run: npm run dist -w packages/ring -- --publish never

      - name: Checksum
        shell: bash
        working-directory: packages/ring/release
        run: sha256sum OrbitRing-Setup-*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OrbitRing-Setup
          path: |
            packages/ring/release/OrbitRing-Setup-*.exe
            packages/ring/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OrbitRing-Setup
          path: release

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release/OrbitRing-Setup-*.exe release/SHA256SUMS.txt \
            --title "OrbitRing $GITHUB_REF_NAME" --generate-notes --verify-tag "${flags[@]}"
