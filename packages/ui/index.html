<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OrbitRing</title>
    <style>
      body { margin: 0; background: #0A0A0B; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #0A0A0B;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        transition: opacity 0.4s;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash svg { width: 64px; height: 64px; animation: pulse 2s ease-in-out infinite; }
      #splash .logo-text {
        margin-top: 16px;
        font: 600 18px Inter, Arial, sans-serif;
        color: #F7F8F4; letter-spacing: -0.5px;
      }
      #splash .logo-text span { font-weight: 300; }
      #splash .loader {
        margin-top: 24px; width: 120px; height: 2px;
        background: #2A2A30; border-radius: 1px; overflow: hidden;
      }
      #splash .loader-bar {
        width: 40%; height: 100%;
        background: #C6F432; border-radius: 1px;
        animation: slide 1.2s ease-in-out infinite;
      }
      #splash .status {
        margin-top: 10px;
        font: 11px/1 'Segoe UI', monospace;
        color: #71717A;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.85; }
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body class="bg-[#0A0A0B] text-[#FAFAFA]">
    <!-- Splash / Loading screen -->
    <div id="splash">
      <svg viewBox="0 0 128 128">
        <circle cx="64" cy="64" r="42" fill="none" stroke="#F7F8F4" stroke-width="8" stroke-linecap="round" stroke-dasharray="183 81" transform="rotate(-53 64 64)"/>
        <circle cx="64" cy="64" r="26" fill="none" stroke="#F7F8F4" stroke-width="6" opacity=".34"/>
        <path d="M64 38 V48 M64 80 V90 M38 64 H48 M80 64 H90" stroke="#F7F8F4" stroke-width="4" stroke-linecap="round" opacity=".55"/>
        <circle cx="64" cy="64" r="10" fill="#C6F432"/>
        <circle cx="99.9" cy="42.4" r="8" fill="#C6F432"/>
      </svg>
      <div class="logo-text">orbit<span>Ring</span></div>
      <div class="loader"><div class="loader-bar"></div></div>
      <div class="status">loading...</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash after React mounts + minimum 2.5s display time
      var splashStart = Date.now();
      var appReady = false;
      function hideSplash() {
        var elapsed = Date.now() - splashStart;
        var remaining = Math.max(0, 2500 - elapsed);
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.querySelector('.status').textContent = 'ready';
            setTimeout(function() {
              splash.classList.add('hide');
              setTimeout(function() { splash.remove(); }, 500);
            }, 300);
          }
        }, remaining);
      }
      var observer = new MutationObserver(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          observer.disconnect();
          hideSplash();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
