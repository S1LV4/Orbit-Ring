<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="./favicon.webp" />
    <title>OrbitRing</title>
    <style>
      body { margin: 0; background: #0A0A0B; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #0A0A0B;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        transition: opacity 0.4s;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 80px; height: 80px; animation: pulse 2s ease-in-out infinite; }
      #splash .logo-text {
        margin-top: 16px;
        font: 600 18px Inter, Arial, sans-serif;
        color: #F7F8F4; letter-spacing: -0.5px;
      }
      #splash .logo-text span { font-weight: 300; }
      #splash .loader {
        margin-top: 24px; width: 120px; height: 2px;
        background: #2A2A30; border-radius: 1px; overflow: hidden;
      }
      #splash .loader-bar {
        width: 40%; height: 100%;
        background: #C6F432; border-radius: 1px;
        animation: slide 1.2s ease-in-out infinite;
      }
      #splash .status {
        margin-top: 10px;
        font: 11px/1 'Segoe UI', monospace;
        color: #71717A;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.85; }
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body class="bg-orbit-bg text-orbit-text">
    <div id="splash">
      <img src="./orbitring-icon.webp" alt="" draggable="false" />
      <div class="logo-text">orbit<span>Ring</span></div>
      <div class="loader"><div class="loader-bar"></div></div>
      <div class="status">loading...</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      var splashStart = Date.now();
      var appReady = false;
      function hideSplash() {
        var elapsed = Date.now() - splashStart;
        var remaining = Math.max(0, 2500 - elapsed);
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.querySelector('.status').textContent = 'ready';
            setTimeout(function() {
              splash.classList.add('hide');
              setTimeout(function() { splash.remove(); }, 500);
            }, 300);
          }
        }, remaining);
      }
      var observer = new MutationObserver(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          observer.disconnect();
          hideSplash();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
