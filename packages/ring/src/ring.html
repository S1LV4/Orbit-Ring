<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ring</title>
<style>
:root{
  --acc:#C6F432;--glow:#C6F43255;--bg:#1a1a1e;
  --sec:transparent;   /* fatias de seleção invisíveis (a zona angular continua funcionando) */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:transparent;user-select:none;font-family:'Segoe UI',system-ui,sans-serif;-webkit-app-region:no-drag}
#stage{position:absolute;inset:0}

/* ASCII (área limitada ao redor do anel, não a tela inteira) */
.asc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:400 7px/8px Consolas,ui-monospace,monospace;letter-spacing:0;white-space:pre;pointer-events:none}
.asc.dim{color:var(--a-dim)}.asc.mid{color:var(--a-mid)}.asc.acc{color:var(--a-acc);opacity:.9}
:root{--a-dim:#4A5061;--a-mid:#808899;--a-acc:var(--acc)}
html.light{--a-dim:#B6BAC4;--a-mid:#6C717E;--a-acc:#5E7F0C}

/* Seletor de tema preto / branco */
.theme{position:fixed;top:16px;right:16px;z-index:30;display:flex;gap:6px;padding:5px;border-radius:999px;
  background:rgba(18,19,22,.7);border:1px solid #2A2A30;backdrop-filter:blur(6px)}
.theme button{width:20px;height:20px;border-radius:999px;cursor:pointer;border:1px solid #3A3D45;
  box-shadow:0 0 0 0 transparent;transition:box-shadow 160ms,transform 160ms}
.theme button:hover{transform:scale(1.1)}
.theme button[data-t=dark]{background:#0A0A0B}
.theme button[data-t=light]{background:#FAFAFA}
.theme button[aria-checked=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--acc)}
html.light .theme{background:rgba(255,255,255,.75);border-color:#D8D8E0}
html.light .theme button[aria-checked=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px #5E7F0C}

/* Setor angular: mostra a "fatia" que o gesto está selecionando */
.sector{position:absolute;border-radius:50%;pointer-events:none;opacity:0;transition:opacity 160ms}

.pos{position:absolute;left:0;top:0;will-change:transform,opacity}
.btn{position:relative;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:999px;
  border:1px solid #2A2A30;background:#121316;color:#D4D4D8;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background 200ms,border-color 200ms,color 200ms,box-shadow 240ms}
.btn.hot{border-color:var(--acc);color:#FAFAFA;box-shadow:0 0 12px var(--glow),0 0 4px var(--acc)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.grp{width:52px;height:52px;margin:-26px 0 0 -26px;background:#17181C;border-color:#33353D}
.grp.active{background:var(--acc);border-color:var(--acc);color:#0A0A0B}
.grp .badge{position:absolute;right:-2px;bottom:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:#0B0C0E;border:1px solid #33353D;color:#8A8A93;font:600 9px/14px 'Segoe UI',sans-serif;text-align:center}
.grp.active .badge{border-color:#0A0A0B}

.hub{width:60px;height:60px;margin:-30px 0 0 -30px;background:#0F1013;border-color:#2E3038;color:var(--acc)}
.hub.open{background:#000;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 28px var(--glow),inset 0 0 22px #000}
.hub .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transition:transform 480ms cubic-bezier(.34,1.56,.64,1),opacity 200ms}
.hub.open .ic.plus{transform:rotate(135deg)}
.hub .ic.back{opacity:0;transform:rotate(-90deg) scale(.6)}
.hub.in-group .ic.plus{opacity:0;transform:rotate(225deg) scale(.6)}
.hub.in-group .ic.back{opacity:1;transform:none}

.goo{position:absolute;width:760px;height:760px;filter:url(#goo-f);pointer-events:none}
.drop{position:absolute;border-radius:999px;background:var(--acc)}
.stars{position:absolute;width:0;height:0;pointer-events:none}
.star{position:absolute;left:0;top:0;border-radius:999px;background:var(--acc);box-shadow:0 0 6px var(--acc)}
.star.w{background:#FAFAFA;box-shadow:0 0 6px rgba(250,250,250,.7)}

.breathe{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:999px;border:1px solid var(--acc);opacity:0;pointer-events:none}
.breathe.on{animation:breathe 2.4s ease-out infinite}
@keyframes breathe{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.75);opacity:0}}

/* Cursor virtual: o cursor real fica preso no centro, então mostramos onde o gesto está */
.vcur{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:999px;
  border:1.5px solid #FAFAFA;box-shadow:0 0 8px rgba(250,250,250,.5);pointer-events:none;opacity:0;z-index:15}

.balloon{position:absolute;left:0;top:0;pointer-events:none;z-index:20;padding:5px 12px;border-radius:12px;
  background:#18191D;border:1px solid var(--acc);font:500 11px/1.3 'Segoe UI',sans-serif;color:var(--acc);
  white-space:nowrap;box-shadow:0 0 12px var(--glow);opacity:0;transition:opacity 120ms}

/* Confirmação ao executar (importante no modo "gesto rápido", quando o menu nem aparece) */
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,46px);pointer-events:none;z-index:25;
  padding:6px 14px;border-radius:999px;background:var(--acc);color:#0A0A0B;font:600 11px/1 'Segoe UI',sans-serif;opacity:0}
.toast.show{animation:toast 700ms ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,54px)}15%{opacity:1;transform:translate(-50%,46px)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,40px)}}

html.light{--bg:#F4F4F8}
html.light .btn{background:#F0F0F5;border-color:#D0D0D8;color:#3F3F46}
html.light .grp{background:#E4E4EC;border-color:#C0C0C8}
html.light .grp.active{background:var(--acc);color:#0A0A0B}
html.light .hub{background:#E0E0E8;border-color:#C0C0C8;color:#5E7F0C}
html.light .hub.open{background:#FFF;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 28px var(--glow),inset 0 0 18px rgba(0,0,0,.06)}
html.light .grp .badge{background:#FFF;border-color:#C0C0C8;color:#52525B}
html.light .vcur{border-color:#3F3F46;box-shadow:none}
html.light .balloon{background:#FFF;color:#3F5508;border-color:#9DBF2A}
html.light .btn.hot{color:#18181B}
</style>
</head>

const CFG={
  R1:75,R2:150,STEP:28,   // raios e espaçamento angular das ações (graus)
  DZ:22,                  // zona morta central: soltar aqui cancela
  HYST:8,                 // histerese angular (graus) — evita "piscar" na borda entre fatias
  revealDelay:120,        // ms parado antes de mostrar o menu (gesto rápido não precisa vê-lo)
  revealMax:320,          // ms máximo até mostrar mesmo com o mouse em movimento
  liquid:true,MA:8
};
const D2R=Math.PI/180, RAMP=" .:-=+*#%@";
let reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let CX=0,CY=0;
let groups=[],isOpen=false,visible=false,activeGroup=null,hover=null;

const E={nodes:{}},A={cw:4.2,lh:8,box:440,cols:0,rows:0};
const sim={f:0,t:0,change:0,nodes:{},tgt:{},drops:[],openP:0,flow:0,burst:0,parts:[],lastPath:null,

for(let i=0;i<30;i++){const h=Math.sin(i*91.7)*43758.5453,r=h-Math.floor(h);
  sim.parts.push({p:i/30,arm:i%2,sz:1.4+r*2,tw:r*6.28,white:i%3===0})}

// ═══════════════════════════════════════════
// UTILITÁRIOS
// ═══════════════════════════════════════════
function spring(o,k,v,tgt,st,dp){if(reduce){o[k]=tgt;o[v]=0;return}o[v]=(o[v]+(tgt-o[k])*st)*dp;o[k]+=o[v]}
function polar(a,r){return{x:Math.cos(a*D2R)*r,y:Math.sin(a*D2R)*r}}
function angDiff(a,b){return((a-b)%360+540)%360-180}
function gIdx(id){for(let i=0;i<groups.length;i++)if(groups[i].id===id)return i;return -1}
function gAng(i){return -90+i*360/groups.length}
function aAng(gi,j){const n=groups[gi].actions.length;return gAng(gi)+(j-(n-1)/2)*CFG.STEP}
function isAct(key){return !!key&&key.indexOf(":")>0}
function actId(key){return key.slice(key.indexOf(":")+1)}
function hash(c,r){const h=Math.sin(c*127.1+r*311.7)*43758.5453;return h-Math.floor(h)}
function setStyle(el,k,v){if(el["_"+k]!==v){el["_"+k]=v;el.style[k]=v}}
function setClass(el,c){if(el._c!==c){el._c=c;el.className=c}}
function mk(tag,cls,parent){const e=document.createElement(tag);if(cls)e.className=cls;(parent||stage).appendChild(e);return e}
function sanitize(gs){
  return (gs||[]).map(g=>({id:String(g.id),name:g.name||g.id,icon:g.icon,
    actions:(g.actions||[]).slice(0,CFG.MA)})).filter(g=>g.actions.length);
}
function pointOn(P,f){
  let L=0;const seg=[];
  for(let i=1;i<P.length;i++){const l=Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y);seg.push(l);L+=l}
  let d=Math.max(0,Math.min(1,f))*L;
  for(let i=0;i<seg.length;i++){
    if(d<=seg[i]||i===seg.length-1){const t=seg[i]?Math.min(1,d/seg[i]):0;
      return{x:P[i].x+(P[i+1].x-P[i].x)*t,y:P[i].y+(P[i+1].y-P[i].y)*t}}
    d-=seg[i];
  }
  return{x:0,y:0};
}
function distSeg(x,y,a,b){
  const vx=b.x-a.x,vy=b.y-a.y,l2=vx*vx+vy*vy;
  let t=l2?((x-a.x)*vx+(y-a.y)*vy)/l2:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(x-a.x-vx*t,y-a.y-vy*t);
}

// ═══════════════════════════════════════════
// DOM
// ═══════════════════════════════════════════
function build(){
  E.ascDim=mk("pre","asc dim");E.ascMid=mk("pre","asc mid");E.ascAcc=mk("pre","asc acc");
  E.sec1=mk("div","sector");E.sec2=mk("div","sector");
  E.goo=mk("div","goo");E.hubDrop=mk("span","drop",E.goo);
  E.drops=sim.drops.map((_,i)=>{const sz=[12,11,10,10,10,11,12][i],d=mk("span","drop",E.goo);

// ═══════════════════════════════════════════
// GEOMETRIA (alvos de cada nó)
// ═══════════════════════════════════════════
function targets(){
  const T={};
  groups.forEach((g,gi)=>{
    const act=activeGroup===g.id,other=!!activeGroup&&!act;
    const p=polar(gAng(gi),visible?CFG.R1:0);
    const s=!visible?0:other?0.84:(!activeGroup&&hover===g.id?1.1:1);
    T[g.id]={x:p.x,y:p.y,s,d:visible&&!activeGroup?gi:0};
    g.actions.forEach((aid,j)=>{
      const key=g.id+":"+aid;
      if(act&&visible){const q=polar(aAng(gi,j),CFG.R2);T[key]={x:q.x,y:q.y,s:hover===key?1.12:1,d:j*2}}
      else T[key]={x:p.x,y:p.y,s:0,d:0};
    });
  });
  return T;
}

// ═══════════════════════════════════════════
// SELEÇÃO POR ÂNGULO (marking menu)
// ═══════════════════════════════════════════
function pickGroup(ang,cur){
  const W=360/groups.length,ci=gIdx(cur);
  if(ci>=0&&Math.abs(angDiff(ang,gAng(ci)))<W/2+CFG.HYST)return cur;
  let best=0,bd=1e9;
  groups.forEach((g,i)=>{const d=Math.abs(angDiff(ang,gAng(i)));if(d<bd){bd=d;best=i}});
  return groups[best].id;
}
function setGroup(id){if(id!==activeGroup){activeGroup=id;sim.change=sim.f}}
function updateSelection(){
  if(!isOpen||!groups.length)return;
  const {R1,R2,DZ,HYST,STEP}=CFG,W=360/groups.length;
  let mag=Math.hypot(dx,dy);const MAX=R2+40;
  if(mag>MAX){dx*=MAX/mag;dy*=MAX/mag;mag=MAX}   // limita o acúmulo: inverter a direção responde na hora
  const ang=Math.atan2(dy,dx)/D2R;

  if(mag<DZ){setGroup(null);hover=null;return}
  if(!activeGroup){
    hover=pickGroup(ang,hover);
    if(mag>=R1*0.7)setGroup(hover);
    return;
  }
  if(mag<R1*0.45){setGroup(null);hover=pickGroup(ang,null);return}

  let gi=gIdx(activeGroup);
  // Ainda perto do anel interno e apontando para outra fatia: troca de grupo sem voltar ao centro
  if(mag<R1+20&&Math.abs(angDiff(ang,gAng(gi)))>W/2+HYST){setGroup(pickGroup(ang,null));gi=gIdx(activeGroup)}
  const g=groups[gi];
  if(mag<R1+18){hover=g.id;return}

  let best=null,bd=1e9;
  g.actions.forEach((aid,j)=>{const d=Math.abs(angDiff(ang,aAng(gi,j)));if(d<bd){bd=d;best=g.id+":"+aid}});
  if(isAct(hover)&&hover.startsWith(g.id+":")&&hover!==best){
    const j=g.actions.indexOf(actId(hover));
    if(j>=0&&Math.abs(angDiff(ang,aAng(gi,j)))<STEP/2+HYST/2)best=hover;
  }
  hover=bd<=STEP*1.2?best:g.id;
}
function setDeltaTo(a,r){const p=polar(a,r);dx=p.x;dy=p.y;lastMove=performance.now();updateSelection()}

// ═══════════════════════════════════════════
// AÇÕES
// ═══════════════════════════════════════════
function resolveFire(){
  if(isAct(hover))return hover;
  const g=groups[gIdx(activeGroup)];
  if(g&&g.actions.length===1)return g.id+":"+g.actions[0];   // grupo de uma ação só: soltar no grupo já executa
  return null;
}
function release(){const k=resolveFire();if(k)fire(k);else hostClose()}
function fire(key){
  if(!isAct(key))return;const aid=actId(key);const c=CAT[aid];
  const n=sim.nodes[key];if(n)n.vs+=0.3;
  sim.burst=0.035;flash(c?c.l:aid);
  const action=c?c.a:{type:"system",action:aid};
  try{window.ring.executeAction(action)}catch(e){}
}
function flash(txt){E.toast.textContent=txt;E.toast.classList.remove("show");void E.toast.offsetWidth;E.toast.classList.add("show")}
function back(){setGroup(null);hover=null;dx=dy=0}
function open(showNow){
  isOpen=true;visible=!!showNow||CFG.revealDelay<=0;activeGroup=null;hover=null;dx=dy=0;
  shownAt=lastMove=performance.now();sim.change=sim.f;sim.openP=0;
  for(const id in sim.nodes)sim.nodes[id]={x:0,y:0,s:0,vx:0,vy:0,vs:0};
}
function reset(){
  isOpen=false;visible=false;activeGroup=null;hover=null;dx=dy=0;sim.openP=0;sim.lastPath=null;
  for(const id in sim.nodes)sim.nodes[id]={x:0,y:0,s:0,vx:0,vy:0,vs:0};
  sim.drops.forEach(d=>Object.assign(d,{x:0,y:0,vx:0,vy:0,s:0,vs:0}));
}
function hostClose(){
  if(hostMode){try{window.ring.close()}catch(e){}}
  else reset();
}

// ═══════════════════════════════════════════
// FÍSICA (passo fixo de 60 Hz, independente da taxa do monitor)
// ═══════════════════════════════════════════
function selPath(){
  if(!visible)return null;
  const O={x:0,y:0};
  const gKey=activeGroup||(hover&&!isAct(hover)?hover:null);
  const g=gKey&&sim.nodes[gKey];if(!g)return null;
  const a=isAct(hover)&&sim.nodes[hover];
  return a?[O,g,a]:[O,g];
}
function step(){
  sim.f++;sim.t+=1/60;
  if(isOpen&&!visible){
    const now=performance.now(),el=now-shownAt;
    if(el>=CFG.revealMax||(el>=CFG.revealDelay&&now-lastMove>=60)){visible=true;sim.change=sim.f}
  }
  const T=targets();
  for(const id in T){
    const n=sim.nodes[id]||(sim.nodes[id]={x:0,y:0,s:0,vx:0,vy:0,vs:0});
    if(sim.f-sim.change>=(T[id].d||0))sim.tgt[id]=T[id];
    const tg=sim.tgt[id]||T[id],a=isAct(id),st=a?0.13:0.16,dp=a?0.76:0.7;
    spring(n,"x","vx",tg.x,st,dp);spring(n,"y","vy",tg.y,st,dp);spring(n,"s","vs",tg.s,st,dp);
  }
  sim.openP+=((visible?1:0)-sim.openP)*(reduce?1:0.14);

  const P=selPath();if(P)sim.lastPath=P;
  const FR=[0.95,0.8,0.65,0.5,0.35,0.2,0.05];
  sim.drops.forEach((d,i)=>{
    const p=P?pointOn(P,FR[i]):{x:0,y:0};
    spring(d,"x","vx",p.x,0.2,0.65);spring(d,"y","vy",p.y,0.2,0.65);
    spring(d,"s","vs",P?1:visible?0.5:0,0.15,0.7);
  });
  sim.flow+=((P?1:0)-sim.flow)*(reduce?1:0.12);
  sim.burst*=0.9;
  sim.parts.forEach(pa=>{pa.p=(pa.p+(0.004+0.014*sim.flow+sim.burst)*(1+pa.p*1.6))%1});
}

function place(el,m,op){
  const sc=Math.max(0,m.s),o=Math.min(1,Math.max(0,sc*1.4-0.2))*op;
  setStyle(el,"transform","translate("+(CX+m.x).toFixed(1)+"px,"+(CY+m.y).toFixed(1)+"px) scale("+sc.toFixed(3)+")");
  setStyle(el,"opacity",o.toFixed(3));
}
function drawSector(el,st,ang,w,on){
  if(on){
    if(!st.on||st.a==null){st.a=ang;st.w=w}
    else{st.a+=angDiff(ang,st.a)*(reduce?1:0.35);st.w+=(w-st.w)*(reduce?1:0.35)}
  }
  st.on=on;setStyle(el,"opacity",on?"1":"0");
  if(st.a!=null){const from=st.a+90-st.w/2;
    setStyle(el,"background","conic-gradient(from "+from.toFixed(1)+"deg,var(--sec) 0deg "+st.w.toFixed(1)+"deg,transparent "+st.w.toFixed(1)+"deg)")}
}
// ── Cena ASCII: buraco negro ──
// Inspirado no visual clássico de um buraco negro com disco de acreção:
//  • sombra: o hub é o horizonte de eventos; nada é desenhado logo atrás dele
//  • disco fino e quase de perfil, inclinado, com rotação diferencial (o interior gira mais rápido)
//    e efeito Doppler (o lado que vem em nossa direção brilha mais)
//  • lente gravitacional: a parte de trás do disco aparece "dobrada" por cima e por baixo do buraco,
//    formando um halo, com um anel de fótons fino e brilhante colado na sombra
//  • estrelas de fundo puxadas em direção ao buraco (distorção da lente)
//  • rastro de cometa na seleção, como matéria sendo sugada
const STAR_CH=[".","·","+","*"];
const BH={RH:33,tilt:-12,squash:0.17,halo:36};
function renderAscii(P){
  const t=sim.t,cw=A.cw,C=A.cols,R=A.rows,half=A.box/2,N=RAMP.length-2,op=Math.max(0,sim.openP);
  const tilt=BH.tilt*D2R,cT=Math.cos(tilt),sT=Math.sin(tilt),RH=BH.RH;
  const ROUT=visible?CFG.R2+55:118,SPAN=ROUT-RH;
  const boost=1+sim.burst*25+sim.flow*0.3;
  const rot=t*0.02,cR=Math.cos(rot),sR=Math.sin(rot);
  const dim=[],mid=[],acc=[];
  const put=(v,hot)=>v>0.5?(hot?3:2):v>0.2?2:1;
  for(let r=0;r<R;r++){
    let ld="",lm="",la="";
    for(let c=0;c<C;c++){
      const x=(c-C/2+0.5)*cw,y=(r-R/2+0.5)*A.lh,d=Math.hypot(x,y);
      let ch=" ",L=0; // L: 0 nada, 1 dim, 2 mid, 3 acc
      // matéria sendo puxada pelo caminho da seleção
      if(P){
        let gd=99;for(let i=1;i<P.length;i++)gd=Math.min(gd,distSeg(x,y,P[i-1],P[i]));
        if(gd<12){const v=(1-gd/12)*(0.55+0.45*Math.sin(t*6+d*0.15));
          if(v>0.15){ch=RAMP[1+Math.floor(Math.min(v,1)*N)];L=3}}
      }
      if(!L&&d>RH-6){
        const u=x*cT+y*sT,w=-x*sT+y*cT;          // referencial inclinado do disco
        // disco de acreção fino (a metade da frente passa por cima da sombra; a de trás é escondida)
        const wz=w/BH.squash,rr=Math.hypot(u,wz);
        if(rr>RH+2&&rr<ROUT&&!(d<RH+2&&w<0)){
          const th=Math.atan2(wz,u),k=(rr-RH)/SPAN;
          const om=t*2.6*boost*Math.pow(42/rr,1.5);     // rotação diferencial
          const streak=0.5+0.5*Math.sin(th*5-om*5+rr*0.22+hash(Math.floor(rr/6),0)*6);
          const beam=0.72-0.28*Math.cos(th);             // Doppler: lado esquerdo mais brilhante
          const v=(Math.pow(1-k,1.4)*0.75+Math.exp(-k*6)*1.1)*(0.55+0.45*streak)*beam;
          if(v>0.08){ch=RAMP[1+Math.floor(Math.min(v*1.1,1)*N)];L=put(v,visible)}
        }
        // halo da lente gravitacional + anel de fótons
        if(!L&&d<RH+BH.halo){
          const a=Math.atan2(y,x),q=d-RH;
          const lens=0.25+0.75*Math.pow(Math.abs(w)/Math.max(d,1),0.6);  // mais forte em cima e embaixo
          const ring=Math.exp(-Math.max(0,q-3)/10)*lens;
          const photon=Math.exp(-Math.pow((q-3)/2.4,2));   // anel fino colado na sombra
          const swirl=0.55+0.45*Math.sin(a*6-t*1.8*boost+q*0.4);
          const v=(ring*1.2*swirl+photon*1.3)*(0.85-0.15*Math.cos(a));
          if(v>0.09&&q>0){ch=RAMP[1+Math.floor(Math.min(v,1)*N)];L=put(v,visible)}
        }
      }
      // estrelas com distorção da lente (puxadas para o buraco)
      if(!L&&d<half&&d>RH+BH.halo){
        const pull=1-(RH*RH*1.6)/(d*d),sx=x*pull,sy=y*pull;
        const gx=Math.floor((sx*cR-sy*sR)/7),gy=Math.floor((sx*sR+sy*cR)/9),h=hash(gx,gy);
        if(h<0.03){
          const tw=0.5+0.5*Math.sin(t*(1+h*40)+h*900),vig=1-d/half;
          const b=tw*vig*(0.6+0.4*op);
          if(b>0.12){ch=STAR_CH[Math.min(3,Math.floor(b*(h<0.006?4:2.6)))];L=b>0.55?2:1}
        }
      }
      ld+=L===1?ch:" ";lm+=L===2?ch:" ";la+=L===3?ch:" ";
    }
    dim.push(ld);mid.push(lm);acc.push(la);
  }
  E.ascDim.textContent=dim.join("\n");E.ascMid.textContent=mid.join("\n");E.ascAcc.textContent=acc.join("\n");
}
function render(){
  const t=sim.t,P=selPath();
  if(sim.f%2===0)renderAscii(P);   // ASCII a 30 fps

  // Gosma
  setStyle(E.goo,"opacity",CFG.liquid&&isOpen?"1":"0");
  setStyle(E.hubDrop,"transform","scale("+Math.max(0,sim.openP).toFixed(3)+")");
  sim.drops.forEach((d,i)=>{
    setStyle(E.drops[i],"left",(380+d.x).toFixed(1)+"px");setStyle(E.drops[i],"top",(380+d.y).toFixed(1)+"px");
    setStyle(E.drops[i],"transform","scale("+Math.max(0,d.s).toFixed(3)+")");
  });

  // Partículas: órbita no disco em repouso, fluem pelo caminho da seleção
  const tilt=-18*D2R,cT=Math.cos(tilt),sT=Math.sin(tilt),LP=sim.lastPath,fl=sim.flow;
  sim.parts.forEach((pa,i)=>{
    const q=pa.p,ir=100-q*65,ia=pa.arm*Math.PI+q*5+t*0.5;
    const ex=ir*Math.cos(ia),ey=ir*Math.sin(ia)*0.42;
    let x=ex*cT-ey*sT,y=ex*sT+ey*cT;
    if(LP&&fl>0.01){
      const pt=pointOn(LP,1-q),L=Math.hypot(pt.x,pt.y)||1,j=(pa.sz-2)*2.5*(1-q);
      x+=(pt.x-pt.y/L*j-x)*fl;y+=(pt.y+pt.x/L*j-y)*fl;
    }
    const fade=Math.min(1,q*6)*Math.min(1,(1-q)*6);
    const op=(0.35+0.65*fl)*fade*(0.7+0.3*Math.sin(t*6+pa.tw))*Math.max(0,sim.openP)*(CFG.liquid?1:0);
    const sz=pa.sz*(0.55+0.6*(1-q))*(1+0.3*fl);
    const s=E.star[i];
    setStyle(s,"transform","translate("+(x-sz/2).toFixed(1)+"px,"+(y-sz/2).toFixed(1)+"px)");
    setStyle(s,"width",sz.toFixed(1)+"px");setStyle(s,"height",sz.toFixed(1)+"px");setStyle(s,"opacity",op.toFixed(3));
  });

  // Setores
  const N=groups.length||1,gKey=activeGroup||(hover&&!isAct(hover)?hover:null),gi=gIdx(gKey);
  drawSector(E.sec1,sim.sec1,gi>=0?gAng(gi):0,360/N,visible&&gi>=0);
  if(isAct(hover)&&activeGroup){
    const ai=gIdx(activeGroup),j=groups[ai].actions.indexOf(actId(hover));
    drawSector(E.sec2,sim.sec2,aAng(ai,j),CFG.STEP,visible&&j>=0);
  }else drawSector(E.sec2,sim.sec2,0,CFG.STEP,false);
  setStyle(E.sec1,"filter",activeGroup?"opacity(.55)":"none");

  // Hub
  setClass(E.breathe,"breathe"+(isOpen?"":" on"));
  place(E.hN,{x:0,y:0,s:1},1);
  setClass(E.hB,"btn hub"+(isOpen?" open":"")+(activeGroup&&visible?" in-group":""));

  // Nós
  groups.forEach(g=>{
    const m=sim.nodes[g.id],el=E.nodes[g.id];if(!m||!el)return;
    const act=activeGroup===g.id,other=!!activeGroup&&!act;
    setClass(el.b,el.base+(act?" active":"")+((hover===g.id||act)&&visible?" hot":""));
    place(el.n,m,other?0.45:1);
    g.actions.forEach(aid=>{
      const key=g.id+":"+aid,mi=sim.nodes[key],ea=E.nodes[key];if(!mi||!ea)return;
      setClass(ea.b,ea.base+(hover===key?" hot":""));place(ea.n,mi,1);
    });
  });

  // Cursor virtual (só no app, onde o cursor real fica preso no centro)
  if(hostMode&&visible){
    const mag=Math.hypot(dx,dy);
    setStyle(E.vcur,"transform","translate("+(CX+dx).toFixed(1)+"px,"+(CY+dy).toFixed(1)+"px)");
    setStyle(E.vcur,"opacity",mag<CFG.DZ?"0.3":"0.9");
  }else setStyle(E.vcur,"opacity","0");

  // Balão
  let txt="",n=null;
  if(visible&&hover){n=sim.nodes[hover];const _aid=isAct(hover)?actId(hover):null;const _c=_aid&&CAT[_aid];txt=_aid?(_c?_c.l:_aid):(groups[gIdx(hover)]||{}).name||""}
  if(!txt||!n||n.s<0.5){setStyle(E.bal,"opacity","0")}
  else{
    const d=Math.hypot(n.x,n.y)||1,ux=n.x/d,uy=n.y/d,bx=CX+n.x+ux*34,by=CY+n.y+uy*34;
    const tx=ux>0.35?"0":ux<-0.35?"-100%":"-50%",ty=Math.abs(ux)>0.35?"-50%":(uy<0?"-100%":"0");
    if(E.bal.textContent!==txt)E.bal.textContent=txt;
    setStyle(E.bal,"transform","translate("+bx.toFixed(1)+"px,"+by.toFixed(1)+"px) translate("+tx+","+ty+")");
    setStyle(E.bal,"opacity","1");
  }
}

// ═══════════════════════════════════════════
// LOOP
// ═══════════════════════════════════════════
let last=0,accum=0;const DT=1000/60;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;accum+=Math.min(100,ts-last);last=ts;
  let k=0;while(accum>=DT&&k<4){if(groups.length)step();accum-=DT;k++}
  if(k)render();
}

// ═══════════════════════════════════════════
// TECLADO
// ═══════════════════════════════════════════
addEventListener("keydown",e=>{
  if(e.key==="t"||e.key==="T"){setTheme(document.documentElement.classList.contains("light")?"dark":"light",true);return}
  if(!isOpen||!groups.length)return;
  visible=true;const k=e.key;
  if(k==="Escape"){e.preventDefault();activeGroup?back():hostClose();return}
  if(k==="Backspace"){e.preventDefault();back();return}
  if(k.startsWith("Arrow")){e.preventDefault();cycle(k==="ArrowRight"||k==="ArrowDown"?1:-1);return}
  if(k==="Enter"||k===" "){e.preventDefault();commit();return}
  if(/^[1-9]$/.test(k))pickIndex(+k-1);
});
function cycle(dir){
  if(!activeGroup){const N=groups.length;let i=gIdx(hover);i=i<0?0:(i+dir+N)%N;setDeltaTo(gAng(i),CFG.R1*0.5)}
  else{const gi=gIdx(activeGroup),g=groups[gi],n=g.actions.length;
    let j=isAct(hover)?g.actions.indexOf(actId(hover)):-1;j=j<0?0:(j+dir+n)%n;setDeltaTo(aAng(gi,j),CFG.R2)}
}
function commit(){
  if(isAct(hover))return fire(hover);
  if(!activeGroup&&hover){const gi=gIdx(hover),g=groups[gi];setDeltaTo(gAng(gi),CFG.R1);
    if(g.actions.length===1)fire(g.id+":"+g.actions[0])}
}
function pickIndex(i){
  if(!activeGroup){if(i<groups.length)setDeltaTo(gAng(i),CFG.R1)}
  else{const gi=gIdx(activeGroup);if(i<groups[gi].actions.length){setDeltaTo(aAng(gi,i),CFG.R2);fire(hover)}}
}

// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
function applyConfig(cfg){
  if(cfg.theme)setTheme(cfg.theme==="light"?"light":"dark",false);
  if(cfg.accent){document.documentElement.style.setProperty("--acc",cfg.accent);
    document.documentElement.style.setProperty("--glow",/^#[0-9a-f]{6}$/i.test(cfg.accent)?cfg.accent+"55":"rgba(198,244,50,.33)")}
  if(cfg.liquid!=null)CFG.liquid=!!cfg.liquid;
  if(cfg.revealDelay!=null)CFG.revealDelay=+cfg.revealDelay;
  if(cfg.reduceMotion!=null)reduce=!!cfg.reduceMotion;
  // Register plugin actions in CAT dynamically
  if(cfg.pluginActions){
    cfg.pluginActions.forEach(function(pa){
      if(pa.id){
        CAT[pa.id]={a:{type:"system",action:pa.id},l:pa.name||pa.id,
          s:pa.icon||'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
          sActive:pa.iconActive||null};
      }
    });
  }
  // Update plugin action icons based on state
  if(cfg.pluginStates){
    for(var pid in cfg.pluginStates){
      var ps=cfg.pluginStates[pid];
      for(var aid in ps){
        var key="plugin:"+pid+":"+aid;
        var cat=CAT[key];
        if(cat&&cat.sActive&&typeof ps[aid]==="boolean"){
          // Update the SVG in the DOM for this action
          for(var nk in E.nodes){
            if(nk.endsWith(":"+key)){
              var svg=E.nodes[nk].b.querySelector("svg");
              if(svg) svg.innerHTML=ps[aid]?cat.sActive:cat.s;
            }
          }
        }
      }
    }
  }
  if(cfg.groups){groups=sanitize(cfg.groups);buildNodes()}
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
build();measureChar();layout();
{let t="dark";try{t=localStorage.getItem("ring-theme")||t}catch(e){}setTheme(t,false)}
addEventListener("resize",layout);

if(hostMode){
  window.ring.onConfig&&window.ring.onConfig(cfg=>{applyConfig(cfg);if(isOpen)initNodes(visible)});
  window.ring.onShow(()=>{
    layout();
    if(!groups.length){groups=sanitize(DEFAULT_GROUPS);buildNodes()}
    open(false);
  });
  window.ring.onMove(d=>{dx+=d.dx;dy+=d.dy;lastMove=performance.now();updateSelection()});
  window.ring.onRelease&&window.ring.onRelease(release);
  window.ring.onHide&&window.ring.onHide(reset);
  addEventListener("pointerup",e=>{if(e.button===0&&isOpen&&visible)release()});
}else{
  // Pré-visualização no navegador: a posição do mouse em relação ao centro faz o papel do gesto
  groups=sanitize(DEFAULT_GROUPS);buildNodes();open(true);
  addEventListener("pointermove",e=>{if(!isOpen)return;dx=e.clientX-CX;dy=e.clientY-CY;lastMove=performance.now();updateSelection()});
  addEventListener("pointerup",e=>{if(isOpen&&!E.hB.contains(e.target)&&!E.theme.contains(e.target)){const k=resolveFire();if(k)fire(k)}});
}
requestAnimationFrame(loop);
</script>
